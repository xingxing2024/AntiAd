# 只认确定性的 IPv4 与已知后缀域名，避免误伤：局域网/回环地址、版本号（1.20.1）、没有后缀的文件名都不会命中。
settings:
  check-chat: true
  # 是否检测十进制整数形式的 IP（如 3107365173 就是 185.54.161.53）。
  # 8 位且形如日期（20261012）的数字不算，避免误伤；不想要就改 false。
  check-numeric-ip: true
  # 强制管制期：首次进服后这么多分钟内一律检查（0 = 不强制，直接按老玩家判定）。
  new-player-minutes: 30
  # 一并检查这些广播类命令（不含斜杠、小写）。留空表示不检查任何命令。
  checked-commands: [me]
  notify-permission: antiad.notify
  # 拥有该权限的玩家完全跳过检查（管理员在自己服务器里发地址不会被处理）。
  bypass-permission: antiad.bypass
# 命中不删消息：消息照常发出，但只有发送者自己看得到，其他玩家都不知道；管理员收到通报。
# 广告命中在窗口内累计到 hits 次才封禁 IP 与账号。
trigger:
  hits: 3
  window-seconds: 60
punish:
  # 封禁方式（二选一）：
  #   plugin  = 用插件自带封禁：写 banned-ips.json 与 banned-players.json（IP + 账号一起封），/pardon* 可解封
  #   command = 执行你自己的封禁指令（适合已经装了 LiteBans / CMI 等封禁插件的服），插件只负责踢出、记录与标记
  mode: plugin
  # mode=command 时要执行的指令（不含斜杠）。占位符：
  #   {player} 玩家名  {reason} 封禁理由  {seconds} 秒数（永久为 0）  {duration} 时长（如 2h，永久时为空）
  # 例：LiteBans -> 'tempban {player} {duration} {reason}' ；CMI -> 'cmi ban {player} {seconds} {reason}'
  ban-command: 'ban {player} {reason}'
  # mode=command 时 /antiad unban 要执行的解封指令（占位符：{player}）
  unban-command: 'unban {player}'
  # 0 = 永久封禁；其他数值为封禁秒数（例如 86400 = 一天）。IP 与账号使用同一时长。
  ban-seconds: 0
  # 解封联系方式，填在 {contact} 里，会出现在封禁理由、封禁名单和踢出提示中。
  contact: '服务器交流群'
  ban-reason: '宣传其他服务器（{match}），解封请联系{contact}'
  kick-message: '&c检测到宣传其他服务器，你的 IP 与账号已被封禁。\n&7解封请联系 {contact}'
# 命中记录写入 SQLite（plugins/AntiAd/antiad.db），重启后 60 秒窗口内的累计次数从这里恢复。
storage:
  enabled: true
  # 记录保留天数，0 = 永久保留。
  keep-days: 30
# 自己服务器的地址：命中这些不会被处理，也不会送给 AI 判断。域名白名单同时覆盖子域名。
# 内置还有一份受信任平台表（B站、YouTube、GitHub、mcmod、Modrinth、CurseForge、MC 官方与常見论坛等，见 jar 内 trusted-domains.txt），
# 发这些平台的链接不会命中、不会累计、更不会封禁。
whitelist:
  # 改成你自己服务器的域名；子域名自动覆盖（写 example.com，play.example.com 也放行）。
  domains: [example.com]
  # 改成你自己的：入口节点公网 IP、你自己的 QQ 群号等（逐字比对，写进来的数字不会被当成数字 IP）。
  ips: [1.2.3.4]
  # 玩家白名单：写游戏名或 UUID（名字不分大小写；UUID 带不带横线都认）。
  # 名单里的玩家**完全免检**：不检查、不扣分、不统计、不会被封 —— 和给他们 antiad.bypass 权限等价，
  # 适合把自己、管理组、信任的老玩家写进来（不用担心忘了给权限）。留空 = 不启用。
  players: []
# 整个域名黑名单：已确认的广告域名（写主域即可）。命中即按广告处理：隐藏消息、记录、通报，
# 并**立即封禁 IP 与账号**（不用等窗口累计、不用探测、也不过 AI）。
# 它的任何子域名都算命中（写 xemc.ren，www.xemc.ren / mc.xemc.ren / xx.play.xemc.ren 全拦），
# 也不受 tlds 后缀表限制（品牌后缀、zip 这类文件扩展名后缀照拦）—— "换域名写法绕过检测"的兜底。
# 已在 whitelist.domains / 内置受信任表里的域名不受这里影响；留空 = 不启用。
blocked-domains: []
# 老玩家（免检）判定：三条都满足才算老玩家 —— 累计游玩时长、行为分、近 N 小时没有违规（结构类只算形状，不算违规）。
# 不满足的（刚进服、玩得少、行为分不够、或最近有过违规）一律受管制，检查强度由上面的行为分类决定。
# 三个阈值都设 0 = 关闭这套判定（那样就只有强制管制期生效）。
veteran:
  play-hours: 24
  min-score: 25
  clean-hours: 24
# 玩家行为分类：**按行为累计**（挖方块、指令、进服、命中），不按时间算；分数实时更新，与在线时长无关。
# 只统计受管制的玩家 —— 老玩家不参与行为监测，也不受分类影响（照旧不检查、不扣分、不会被封）。
# 新玩家默认 default-score 分；真的在玩（破坏方块 / 用指令）最多再加 max-activity-score 分；命中一次扣分。
behavior:
  enabled: true
  # 新玩家基础分。
  default-score: 20
  # >= normal-score（默认 30 = 基础 20 + 玩出来的 10 分）：正常玩家 → 只跑规则，不再花 AI 额度。
  # < default-score（也就是低于 20，说明已经出现过违规）：重点关注 → 所有带文字的消息都送 AI，封禁阈值降为 2 次。
  # <= advertiser-score（或被本插件封过，永久记录）：广告号 → 阈值 1 次，下一次命中直接封。
  normal-score: 30
  suspicious-score: 19
  advertiser-score: 5
  # 行为加分：每破坏这么多方块 / 用这么多指令各 +1，合计上限 max-activity-score（在线时长只展示不计分）。
  blocks-per-point: 50
  commands-per-point: 10
  max-activity-score: 20
  # 命中一次扣的分（扣到分类降级：20 分基础，扣 6 分变可疑、扣 15 分变广告号）。
  ad-hit-penalty: 3
  word-hit-penalty: 1
# 结构化拦截：只看消息形状（长度、数字占比、生僻字）与入口（告示牌/铁砧/书），不依赖词库与 AI。
# 结构命中和敏感词一样是"软处理"：影子隐藏 + 通报 + 扣行为分；只有地址命中才计入封禁次数。
structure:
  enabled: true
  # 可见字符数上限（0 = 关）。
  max-length: 120
  # 数字过多：至少这么多位，且占消息长度比例超过 max-digit-ratio（防手机号/身份证/QQ 号）。
  min-digits: 8
  max-digit-ratio: 0.5
  # 生僻字（CJK 扩展区）超过这么多个就拦，防用生僻字规避审查。
  max-rare-chars: 2
  # 把最近这么多条消息拼起来再查一次地址，对抗"把域名拆成多条发"（1 = 关闭）。
  combine-messages: 3
  # 非聊天入口：命中地址同样拦截、通报，并按命中次数累计。
  check-signs: true
  check-anvil: true
  check-books: true
# 地址情报探测：判断命中的地址到底是不是真的 Minecraft 服务器，结论只当线索（给 AI 判断、给管理员通报）。
# 三步：SRV 记录（_minecraft._tcp，MC 客户端专用，存在基本就是服务器，并按它指向的端口去连）→
#       服务器列表协议探测（真服务器会回版本/在线人数/MOTD）→ 网页标题（没确认是服务器时才抓，看是不是"XX 我的世界服务器"站点）。
# 全部在异步线程、带缓存、有总预算；只探公网地址（回环/内网/CGNAT/组播一律拒绝），不会被打成内网扫描器。
probe:
  enabled: true
  # 单次探测的时间预算（毫秒）：SRV + 协议探测 + 网页标题总共不超过这个量级。
  timeout-ms: 2000
  # 同一个地址多久内不重复探测（秒，0 = 不缓存）。
  cache-seconds: 600
  # 没确认是服务器时，是否抓一眼 http(s) 首页标题当线索。
  fetch-title: true
  # true（默认）= 地址命中必须确认对方是 **Minecraft 服务器**才计入封禁次数，满足任一条即可：
  #   ① 有 _minecraft._tcp SRV 记录；② 25565 端口按 MC 协议回了服务器状态；
  #   ③ 25565 端口连得上、只是不回状态（对方开了 enable-status=false 或只挡了探测 —— 玩家照样能进）。
  # 三条都不满足（域名根本不存在、只是个普通网站、端口没人听）只隐藏 + 通报 + 轻度扣分，不会累计到封号。
  # false = 老行为：只要域名/地址规则命中就计入封禁次数。
  confirm-required: true
# 违禁词：命中后不出手，而是连同这个词一起送给 AI 判断；AI 判为广告才只给发送者看并按命中累计。
# AI 未启用（没填 api-key）时退回旧行为：命中即只给发送者看，不处罚。大小写、全角、字间空格不敏感。
# 这里只放**高精度**的引流词（联系方式、地址、明确的其他服名字），日常高频词放 trigger-words，玩法/版本词一律不放。
banned-words:
  # 联系方式与社交平台（含谐音）
  - QQ群
  - Q群
  - 群号
  - 加群
  - 进群
  - 佳群
  - 裙
  - 私聊
  - 私我
  - 加我
  - 客服
  - 企鹅
  - 鹅群
  - 扣扣
  - 抠抠
  - 球球
  - 微信
  - V信
  - vx
  - wx
  - 威信
  - 薇信
  - discord
  - dc
  - kook
  - 开黑啦
  - telegram
  - teleg
  - 公会群
  - 交流群
  - 频道
  # 地址与链接
  - IP地址
  - 服务器地址
  - 进服地址
  - 直连
  - 端口号
  - 域名
  - 网址
  - http
  - https
  - www
  - 点康姆
  - 抗姆
  - 复制到
  - 粘贴到
  - ':25565'
  - ':19132'
  # 拉人与其他服务器
  - 宣传
  - 广告
  - 招人
  - 招募
  - 收人
  - 拉人
  - 欢迎加入
  - 隔壁服
  - 其他服
  - 别的服
  - 友服
  - 兄弟服
  - 转服
  - 合服
  - 互通
  - 新服
  - 开服
  - 首开
  - 内测
  - 公测
  - 不删档
  - hypixel
  - mineplex
  - cubecraft
  - 2b2t
  # 账号交易
  - 卖号
  - 代练
  - 氪金
  - 充值
  - 兑换码
  - 激活码
  - 邀请码
  - 推荐码
  - CDK
  - RMB
  - 红包
# AI 审核（可选）：规则（IP/域名/违禁词）没命中的消息，连同该玩家最近的发言一起交给 OpenAI 兼容接口判断是不是广告。
# 判定期间消息会先扣住（发送者也要等一下），不是广告就照原样放行，是广告就只给发送者看并按命中累计/封禁处理。
# 注意：玩家的聊天内容会发送给该接口，请自行确认隐私与合规。
ai:
  # 默认接智谱 GLM-4-Flash（官方标称免费），去 https://open.bigmodel.cn 拿 API Key 填到下面就能用。
  enabled: true
  url: 'https://open.bigmodel.cn/api/paas/v4/chat/completions'
  # 不能留空，留空就等于没开 AI。
  api-key: ''
  model: 'glm-4-flash'
  # 单次请求超时（秒）。越小玩家等得越短，超时按下面的 fail-open 处理，不会卡住聊天。
  # 智谱 GLM-4-Flash 通常 1 秒内；DeepSeek 首字延迟一般 1~3 秒，用 DeepSeek 时建议调到 4~6，否则会频繁超时=放行。
  timeout-seconds: 2
  # AI 并发线程数。免费额度有 QPS 限制，调小可以减少 429；改这里需要重启。
  max-concurrent: 3
  # 计费单价（元 / 百万 tokens），只用于 /antiad cost 的费用估算，按你用的服务改。
  price:
    input: 2.0
    output: 8.0
  # 预筛关键词：消息里出现这些词（或链接样式）才送 AI，普通闲聊不花额度。
  # 它是「要不要问 AI」的开关，不是处罚条件；写空列表 [] = 所有带文字的消息都送 AI（最贵、也最不容易漏）。
  # 这里放高频、信号中等的词（服务器/进服/福利/版本平台…）；玩法、管理这类日常高频词故意不放。
  trigger-words: [服务器, 服主, 腐竹, 进服, 进游戏, 加入, 来人, 联机, 一起玩, 开黑, 福利, 免费, 白嫖, 公益, 赞助, 奖励, 礼包, 推荐, 安利, 隔壁, 交易, 跑路, 被炸, 被ban, 封号, 解ban, 网易版, 国际版, 基岩版, java版, 手机版, 电脑版, 小游戏, 起床战争, bedwars, skyblock, 空岛, 模组, 整合包]
  # 送给模型的该玩家最近发言条数（上下文）。调小能省输入 tokens（2~3 条通常够用）。
  context-messages: 5
  # 超时、限流或接口报错时是否放行：true = 放行（宁漏勿误伤，规则仍兜底），false = 当作广告处理。
  fail-open: true
  # AI 判定通过后怎么放行这条消息：
  #   false（默认）= 由 AntiAd 按原版格式补发给原观众，任何服务器都能用，但没有聊天插件的前缀/颜色。
  #   true        = 重新合成一次聊天事件，让聊天插件（TrChat 这类）按它自己的格式广播；
  #                 要求服务器确实装了这类插件，否则这条消息没人广播（会丢）。
  refire-approved: false
  # 也可以换成任意 OpenAI 兼容接口：
  #   本地 Ollama（完全免费、离线）：url 'http://127.0.0.1:11434/v1/chat/completions'  model 'qwen2.5:7b'  api-key 'ollama'
  #   DeepSeek（按量付费）：url 'https://api.deepseek.com/v1/chat/completions'  model 'deepseek-chat'
  #   硅基流动：url 'https://api.siliconflow.cn/v1/chat/completions'  model 'Qwen/Qwen2.5-7B-Instruct'
  #   OpenRouter 免费模型：url 'https://openrouter.ai/api/v1/chat/completions'  model 'meta-llama/llama-3.1-8b-instruct:free'
  prompt: |-
    你是 Minecraft 服务器的聊天审核员。判断这条消息是不是在给别的服务器/群做广告（拉人去别处、发联系方式、卖号代练等引流）。
    本服地址是 {self}；提本服或本服群、平台/wiki/mod 站/代码仓库/视频/存档的链接都不算广告。
    普通聊天、提问、报错、玩笑、数字、表情、单字都不算；没有明确引流意图就填 false，拿不准一律 false。
    进服 {minutes} 分钟，本窗口已命中 {hits} 次，命中的敏感词：{words}（只是线索，可能只是正常用词，结合上下文判断，不确定填 false）。
    地址情报：{probe}（对消息里出现的地址做的技术探测，只能说明它是不是一台 Minecraft 服务器，不代表就是广告，仍以引流意图为准）。
    他最近的发言：
    {context}
    本次消息：
    {message}
    只回一行 JSON，不要解释、不要代码块：{"ad":false,"reason":"一句话理由"}
# 检测哪些域名后缀（小写、不含点）。不写这一项 = 使用内置的 379 个服务器常用后缀
# （全部两字母国别后缀 + 常见通用后缀，含 ren、icu、wang 等；品牌后缀和 zip/mov 这类文件扩展名不收）。
# 想自己控制就取消注释，例如：tlds: [com, cn, net, ren]；写 tlds: [] 表示不检测域名，只检测 IP。
# tlds: [com, cn, net, ren]
